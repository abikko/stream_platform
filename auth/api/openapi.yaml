openapi: 3.1.0

info:
  title: Auth service
  version: 0.1.0
  description: |
    Регистрация и вход пользователей stream_platform.

    Ошибки переводятся на JSON-формат `{"code": "...", "message": "..."}`
    (схема `Error`). Клиенту стоит опираться на `code`, а не на `message`:
    `code` — стабильный машинный код, `message` — текст для человека.

    Переход ещё не завершён: в `/register` на JSON отвечают все ошибки,
    кроме неразобранного тела; `/login` пока целиком отвечает обычным
    текстом (`text/plain`) от `http.Error`, с переводом строки в конце.

    `404` (неизвестный путь) и `405` (неподдерживаемый метод) отдаёт сам
    роутер, тоже обычным текстом.

servers:
  - url: http://localhost:8080
    description: Локальный запуск (`make run`)

tags:
  - name: system
    description: Служебные эндпоинты
  - name: auth
    description: Регистрация и вход

paths:
  /health:
    get:
      tags: [system]
      operationId: health
      security: []
      summary: Проверка, что сервис запущен
      responses:
        "200":
          description: Сервис работает. Тело пустое.
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /register:
    post:
      tags: [auth]
      operationId: register
      security: []
      summary: Регистрация пользователя
      description: |
        Создаёт пользователя с указанным email и паролем. Пароль хранится
        в виде bcrypt-хеша.

        Сейчас запрос с неизвестными полями отклоняется с `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: user@example.com
              password: secret123
      responses:
        "201":
          description: Пользователь создан.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
              example:
                id: 3f2b8c1e-6a4d-4e9b-9c1a-2d7e5f0a8b44
        "400":
          description: |
            Некорректный запрос.

            - Поля не прошли проверку (email или пароль пустые, пароль
              длиннее 72 байт) — `application/json`, `code: validation_failed`
              и список `fields` сразу со всеми ошибками.
            - Тело не JSON или содержит неизвестные поля — пока обычный
              текст (`text/plain`).

            Сейчас `message` у элементов `fields` — временная заглушка
            `error validate`: тексты появятся вместе с локализацией.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              examples:
                emailEmpty:
                  summary: Пустой email
                  value:
                    code: validation_failed
                    message: Validation error
                    fields:
                      - field: email
                        code: required
                        message: error validate
                emailEmptyPasswordTooLong:
                  summary: Пустой email и пароль длиннее 72 байт
                  value:
                    code: validation_failed
                    message: Validation error
                    fields:
                      - field: email
                        code: required
                        message: error validate
                      - field: password
                        code: too_long
                        message: error validate
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
              example: "Unable to parse\n"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: Пользователь с таким email уже существует.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: email_already_in_use
                message: email already in use
        "500":
          $ref: "#/components/responses/InternalError"

  /login:
    post:
      tags: [auth]
      operationId: login
      security: []
      summary: Вход по email и паролю
      description: |
        Проверяет email и пароль. Пока не выдаёт токен: успешный ответ — это
        только код `200`.

        Неизвестные поля в теле игнорируются. Для несуществующего email и
        неверного пароля ответ одинаковый.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: user@example.com
              password: secret123
      responses:
        "200":
          description: Email и пароль верные. Тело пустое.
        "400":
          description: Тело не JSON, email или пароль пустые.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
              examples:
                parse:
                  summary: Тело не разобрано
                  value: "unable to parse\n"
                emailEmpty:
                  summary: Пустой email
                  value: "Provided email is empty\n"
                passwordEmpty:
                  summary: Пустой пароль
                  value: "Provided password is empty\n"
        "401":
          description: Неверный email или пароль.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
              example: "Invalid credentials\n"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          description: Внутренняя ошибка. Подробности только в логах сервера.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
              example: "unable to login\n"

components:
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: Не пустой. Формат email сервер пока не проверяет.
          examples: [user@example.com]
        password:
          type: string
          description: Не пустой, не длиннее 72 байт (ограничение bcrypt).
          examples: [secret123]

    RegisterResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Идентификатор созданного пользователя.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          examples: [user@example.com]
        password:
          type: string
          examples: [secret123]

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Стабильный машинный код в snake_case. На него опирается клиент.
          examples: [email_already_in_use]
        message:
          type: string
          description: Текст для человека. Может меняться.

    ValidationError:
      description: Ошибка проверки полей запроса — сразу все ошибки, а не первая.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [fields]
          properties:
            code:
              const: validation_failed
            fields:
              type: array
              items:
                $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Имя поля из тела запроса.
          examples: [email]
        code:
          type: string
          description: Код ошибки поля, общий для всех полей.
          enum: [required, too_long]
        message:
          type: string
          description: Текст для человека. Сейчас всегда заглушка `error validate`.

    ErrorText:
      type: string
      description: Текст ошибки с переводом строки в конце.

  responses:
    InternalError:
      description: Внутренняя ошибка. Подробности только в логах сервера.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: internal_error
            message: Internal Server Error

    MethodNotAllowed:
      description: |
        Метод не поддерживается этим путём. Ответ формирует сам `ServeMux`,
        поэтому он всегда `text/plain`.
      headers:
        Allow:
          description: Методы, которые поддерживает путь.
          schema:
            type: string
          example: POST
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorText"
          example: "Method Not Allowed\n"
